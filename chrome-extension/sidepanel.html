<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>清瀬リンク サイドパネル</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #f5f3fb;
      display: flex; flex-direction: column;
    }
    .header {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      background: linear-gradient(135deg, #7a6dd6, #6358c5);
      color: #fff;
      border-bottom: 1px solid rgba(0,0,0,.1);
    }
    .header img {
      width: 28px; height: 28px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.6);
      background: #fff;
    }
    .header .name { font-size: 13px; font-weight: 800; line-height: 1.1; }
    .header .sub { font-size: 10px; opacity: .85; }
    .header .actions { margin-left: auto; display: flex; gap: 6px; }
    .header button {
      background: rgba(255,255,255,.18);
      border: none; color: #fff;
      width: 26px; height: 26px;
      border-radius: 6px;
      cursor: pointer; font-size: 13px;
    }
    .header button:hover { background: rgba(255,255,255,.32); }
    iframe {
      flex: 1; width: 100%; border: 0; background: #fff;
    }
    .login-hint {
      position: absolute; top: 60px; left: 12px; right: 12px;
      background: #fff; padding: 12px;
      border: 1px solid #d6cef0; border-radius: 12px;
      font-size: 12px; line-height: 1.5;
      box-shadow: 0 4px 16px rgba(80,80,130,.12);
      display: none;
    }
    .login-hint.show { display: block; }
    .login-hint a { color: #7a6dd6; font-weight: 700; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon128.png" alt="" />
    <div>
      <div class="name">清瀬リンク</div>
      <div class="sub">サイドパネル</div>
    </div>
    <div class="actions">
      <button id="btn-open" title="新しいタブで開く">⇗</button>
      <button id="btn-reload" title="再読み込み">🔄</button>
    </div>
  </div>
  <iframe id="frame" src="https://secretary-ai-next.vercel.app/"></iframe>

  <div class="login-hint" id="hint">
    秘書アプリの認証が iframe 内で動かない場合は、
    <a href="https://secretary-ai-next.vercel.app/" target="_blank">こちら</a>
    で一度ログインしてから戻ってください。
  </div>

  <script>
    const frame = document.getElementById("frame");
    document.getElementById("btn-reload").addEventListener("click", () => {
      try { frame.contentWindow.location.reload(); }
      catch { frame.src = frame.src; }
    });
    document.getElementById("btn-open").addEventListener("click", () => {
      chrome.tabs.create({ url: "https://secretary-ai-next.vercel.app/" });
    });
    // iframe 読込失敗時のヒント
    let loaded = false;
    frame.addEventListener("load", () => { loaded = true; });
    setTimeout(() => {
      if (!loaded) document.getElementById("hint").classList.add("show");
    }, 8000);
  </script>
</body>
</html>
